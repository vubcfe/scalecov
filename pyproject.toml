[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalecov"
dynamic = ["version"]
description = "ScaleCov (coverage across scales): calibrate and check prediction intervals of spatial maps for pixels, units and groups of units"
readme = "README.md"
license = { file = "LICENSE.txt" }
requires-python = ">=3.9"
authors = [
  { name = "Cao Vu Bui", email = "vubc@fe.edu.vn" },
  { name = "Hoang-Anh-Vu Nguyen" },
  { name = "Van-Nam Nguyen" },
]
keywords = ["conformal prediction", "uncertainty", "spatial aggregation", "remote sensing", "change of support"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "pandas>=2.2", "scipy>=1.8"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]
docs = ["mkdocs>=1.5,<2", "mkdocs-material>=9,<10", "mkdocstrings[python]>=0.24"]
dev = ["scalecov[test,docs,plot]", "ruff>=0.4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/vubcfe/scalecov"
Documentation = "https://scalecov.readthedocs.io"
Issues = "https://github.com/vubcfe/scalecov/issues"

[tool.hatch.version]
path = "src/scalecov/_version.py"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
